# QA environment configuration (default environment; -Denv=qa)
# Env-independent defaults (timeouts, ports, api.key) live in
# common.properties - only genuinely environment-specific values belong here.
rest.base.url=https://reqres.in/api
# Real, third-party, environment-independent public GraphQL endpoint - the
# same value is reused as-is across qa/staging/prod (no staging/prod host
# exists for this public service). The sample stub-backed GraphQL test
# (UserQueryTests) overrides this with a local WireMock URL at runtime and
# never reads this property.
graphql.base.url=https://countries.trevorblades.com/graphql
# Real, third-party, environment-independent public WebSocket echo endpoint -
# the same value is reused as-is across qa/staging/prod. The sample
# embedded-server test (EchoWebSocketTests) always connects to its own
# local server's actual port and never reads this property.
websocket.base.url=wss://echo.websocket.org
