# Environment-independent defaults, loaded first and shared by every
# environment (qa/staging/prod) - see ConfigLoader. Only put a value here
# if it should hold regardless of -Denv; a genuinely environment-specific
# value (e.g. a base URL) belongs in <env>.properties instead, where it
# overrides whatever key of the same name appears here.
webhook.port=0
request.timeout.ms=10000
# Never commit a real value here. Supply via the API_KEY environment
# variable or a gitignored <env>.local.properties override.
api.key=
# Comma-separated header/query-parameter names masked in logs and Allure
# attachments (see LogMasker). Add a name here (or in a per-environment
# *.properties override) to mask it - no Java code change or rebuild
# needed. Falls back to Constants.SENSITIVE_DATA's compiled-in default if
# this key is removed/left blank.
sensitive.data.names=authorization,api-key,x-api-key,apikey,password,token,secret,webhookfallbackdemo.auth.password,webhookfallbackdemo.auth.bearer.token,webhookfallbackdemobearer.auth.bearer.token,oauth2accesstokenpositivedemo.auth.client.secret,oidcidtokenpositivedemo.auth.client.secret,jwtbearerpositivedemo.auth.jwt.token,oauth2refreshtokenpositivedemo.auth.client.secret,oauth2refreshtokenpositivedemo.auth.refresh.token,jwtbearervalidcachedemo.auth.jwt.token,jwtbearerexpireddemo.auth.jwt.token,jwtbearernoexpdemo.auth.jwt.token,oauth2refreshtokencachehitdemo.auth.refresh.token,oauth2refreshtokencachemissdemo.auth.refresh.token,client_secret,refresh_token

# --- Per-endpoint-key auth strategy / rate limit / 503 fallback config ---
# See AuthStrategyFactory/RateLimitHelper/FallbackHelper.
#
# "users" ships as the explicit, backward-compatible default: API_KEY via
# the existing api.key property, byte-for-byte the same behavior as before
# this config existed.
users.auth.strategy=API_KEY
users.auth.header.name=x-api-key
# users.auth.strategy's credential is the existing api.key property - not duplicated.
users.rate.limit.per.second=100
users.fallback.on503.enabled=false
users.fallback.webhook.path=/fallback/users

# "webhookFallbackDemo"/"webhookFallbackDemoBearer" are test-owned endpoint
# keys (target: the local WebhookReceiver/RestStubServer, never a real third
# party) used only to demonstrate BASIC and BEARER auth end to end, since
# reqres.in offers no lever to require those schemes and a single endpoint
# key cannot hold two different configured strategies at once. Never commit
# real credential values here - supply via env var or a gitignored
# <env>.local.properties override.
webhookFallbackDemo.auth.strategy=BASIC
webhookFallbackDemo.auth.username=
webhookFallbackDemo.auth.password=
webhookFallbackDemoBearer.auth.strategy=BEARER
webhookFallbackDemoBearer.auth.bearer.token=
# "webhookNoAuthDemo" deliberately has no *.auth.strategy property at all -
# the "no mechanism configured" case (Functional Requirement 6).

# --- Token-acquiring auth strategy demonstration endpoint keys (local RestStubServer target,
# TokenEndpointOverride points each at the stub's dynamic port during the test) - see
# clients/auth/{OAuth2AccessTokenAuthStrategy,OidcIdTokenAuthStrategy,JwtBearerAuthStrategy,
# OAuth2RefreshTokenAuthStrategy}. Each scenario gets its own endpoint key/client id (never
# shared) so its cached token can never collide with another scenario's - see the plan's
# resolution of "auth-under-test bypass" (distinct credential identity per test). Never commit
# real credential values here.
oauth2AccessTokenPositiveDemo.auth.strategy=OAUTH2_ACCESS_TOKEN
oauth2AccessTokenPositiveDemo.auth.client.id=oauth2-access-positive
oauth2AccessTokenPositiveDemo.auth.client.secret=
oauth2AccessTokenPositiveDemo.auth.scope=read write
oauth2AccessTokenCacheHitDemo.auth.strategy=OAUTH2_ACCESS_TOKEN
oauth2AccessTokenCacheHitDemo.auth.client.id=oauth2-access-cachehit
oauth2AccessTokenCacheMissDemo.auth.strategy=OAUTH2_ACCESS_TOKEN
oauth2AccessTokenCacheMissDemo.auth.client.id=oauth2-access-cachemiss
oauth2AccessTokenNoExpiryDemo.auth.strategy=OAUTH2_ACCESS_TOKEN
oauth2AccessTokenNoExpiryDemo.auth.client.id=oauth2-access-noexpiry
oauth2AccessTokenIdentityADemo.auth.strategy=OAUTH2_ACCESS_TOKEN
oauth2AccessTokenIdentityADemo.auth.client.id=oauth2-access-identity-a
oauth2AccessTokenIdentityBDemo.auth.strategy=OAUTH2_ACCESS_TOKEN
oauth2AccessTokenIdentityBDemo.auth.client.id=oauth2-access-identity-b

oidcIdTokenPositiveDemo.auth.strategy=OIDC_ID_TOKEN
oidcIdTokenPositiveDemo.auth.client.id=oidc-positive
oidcIdTokenPositiveDemo.auth.client.secret=
oidcIdTokenPositiveDemo.auth.scope=openid
oidcIdTokenHttpOnlyDemo.auth.strategy=OIDC_ID_TOKEN
oidcIdTokenHttpOnlyDemo.auth.client.id=oidc-http-only
oidcIdTokenJwtOnlyDemo.auth.strategy=OIDC_ID_TOKEN
oidcIdTokenJwtOnlyDemo.auth.client.id=oidc-jwt-only
oidcIdTokenBothDemo.auth.strategy=OIDC_ID_TOKEN
oidcIdTokenBothDemo.auth.client.id=oidc-both
oidcIdTokenMalformedDemo.auth.strategy=OIDC_ID_TOKEN
oidcIdTokenMalformedDemo.auth.client.id=oidc-malformed
oidcIdTokenHttpFieldExpiredDemo.auth.strategy=OIDC_ID_TOKEN
oidcIdTokenHttpFieldExpiredDemo.auth.client.id=oidc-http-field-expired
oidcIdTokenJwtExpExpiredDemo.auth.strategy=OIDC_ID_TOKEN
oidcIdTokenJwtExpExpiredDemo.auth.client.id=oidc-jwt-exp-expired

# JWT values below carry a hardcoded (unsigned - signature verification is explicitly out of
# scope, see JwtClaimsDecoder) exp claim: 4102444800 = 2100-01-01T00:00:00Z (far future, always
# valid for this suite's lifetime), 946684800 = 2000-01-01T00:00:00Z (far past, always expired).
jwtBearerPositiveDemo.auth.strategy=JWT_BEARER
jwtBearerPositiveDemo.auth.client.id=jwt-bearer-positive
jwtBearerPositiveDemo.auth.jwt.token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ0ZXN0LWNsaWVudCIsImV4cCI6NDEwMjQ0NDgwMH0.sig
jwtBearerValidCacheDemo.auth.strategy=JWT_BEARER
jwtBearerValidCacheDemo.auth.client.id=jwt-bearer-cache
jwtBearerValidCacheDemo.auth.jwt.token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ0ZXN0LWNsaWVudCIsImV4cCI6NDEwMjQ0NDgwMH0.sig
jwtBearerExpiredDemo.auth.strategy=JWT_BEARER
jwtBearerExpiredDemo.auth.client.id=jwt-bearer-expired
jwtBearerExpiredDemo.auth.jwt.token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ0ZXN0LWNsaWVudCIsImV4cCI6OTQ2Njg0ODAwfQ.sig
jwtBearerNoExpDemo.auth.strategy=JWT_BEARER
jwtBearerNoExpDemo.auth.client.id=jwt-bearer-noexp
jwtBearerNoExpDemo.auth.jwt.token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ0ZXN0LWNsaWVudCJ9.sig

oauth2RefreshTokenPositiveDemo.auth.strategy=OAUTH2_REFRESH_TOKEN
oauth2RefreshTokenPositiveDemo.auth.client.id=oauth2-refresh-positive
oauth2RefreshTokenPositiveDemo.auth.client.secret=
oauth2RefreshTokenPositiveDemo.auth.refresh.token=tGzv3JOkF0XG5Qx2TlKWIA
oauth2RefreshTokenCacheHitDemo.auth.strategy=OAUTH2_REFRESH_TOKEN
oauth2RefreshTokenCacheHitDemo.auth.client.id=oauth2-refresh-cachehit
oauth2RefreshTokenCacheHitDemo.auth.refresh.token=tGzv3JOkF0XG5Qx2TlKWIA-cachehit
oauth2RefreshTokenCacheMissDemo.auth.strategy=OAUTH2_REFRESH_TOKEN
oauth2RefreshTokenCacheMissDemo.auth.client.id=oauth2-refresh-cachemiss
oauth2RefreshTokenCacheMissDemo.auth.refresh.token=tGzv3JOkF0XG5Qx2TlKWIA-cachemiss
oauth2RefreshTokenMaskingDemo.auth.strategy=OAUTH2_REFRESH_TOKEN
oauth2RefreshTokenMaskingDemo.auth.client.id=oauth2-refresh-masking
oauth2RefreshTokenMaskingDemo.auth.refresh.token=tGzv3JOkF0XG5Qx2TlKWIA

# Token cache (see clients/auth/cache/TokenCacheRegistry) - defaults shown explicitly.
auth.token.cache.max.size=50
auth.token.cache.max.ttl.ms=86400000
auth.token.cache.safety.margin.seconds=30

# Rate-limit demonstration endpoint keys (local RestStubServer target only) -
# two different configured limits (N != M) so pacing is provably independent
# per endpoint key, plus one deliberately unconfigured (no-op) key.
rateLimitDemoA.rate.limit.per.second=5
rateLimitDemoB.rate.limit.per.second=2
# rateLimitDemoUnlimited deliberately has no *.rate.limit.per.second property.

# 503-fallback demonstration endpoint keys (local RestStubServer primary +
# local WebhookReceiver fallback target).
fallbackDemoOn.fallback.on503.enabled=true
fallbackDemoOn.fallback.webhook.path=/fallback/demo-on
fallbackDemoOff.fallback.on503.enabled=false
fallbackDemoOff.fallback.webhook.path=/fallback/demo-off
fallbackDemoIsolationB.fallback.on503.enabled=false
fallbackDemoIsolationB.fallback.webhook.path=/fallback/demo-isolation-b

# --- RetryHelper (see RestUserService#getUserByIdWithRetry) ---
retry.transient.statuses=502,503,504
retry.max.attempts=3
# "retryDemo" (RetryHelperTests' endpointKey for getFromOverrideBaseUriWithRetry) deliberately has no
# *.rate.limit.per.second property - proves the no-op pacing baseline for the existing exact-call-count
# and 15s-bounded-timeout assertions.
retry.initial.delay.ms=200
